<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Route Map & YouTube Tool</title>
    
    <!-- 1. Map Layout Stylesheets -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <link rel="stylesheet" href="https://unpkg.com" />

    <style>
        body { margin: 0; padding: 0; display: flex; font-family: Arial, sans-serif; }
        #map { width: 65%; height: 100vh; }
        #sidebar { width: 35%; height: 100vh; background: #f9f9f9; box-sizing: border-box; padding: 15px; display: flex; flex-direction: column; gap: 15px; border-left: 2px solid #ccc; overflow-y: auto; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #status { color: #007bff; font-weight: bold; margin-bottom: 5px; }
        .btn { background: #28a745; color: white; border: none; padding: 10px; font-size: 14px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn:hover { background: #218838; }
        .input-box { width: 93%; padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 5px; }
    </style>
</head>
<body>

    <!-- 2. Visible Web Page Content -->
    <div id="map"></div>

    <div id="sidebar">
        <h2>Shortest Route Tool</h2>
        <div id="status">Waiting for GPS permission...</div>
        
        <button class="btn" onclick="updateMyLocation()">🔄 Refresh My Location</button>
        
        <p style="font-size: 13px; color: #555;">Click anywhere on the map to draw the shortest route from your location.</p>
        
        <hr>
        
        <h3>YouTube Video Panel</h3>
        <input type="text" id="ytUrl" class="input-box" placeholder="Paste YouTube link here..." oninput="changeVideo()">
        <p style="font-size: 11px; color: #777; margin: 2px 0 10px 0;">Example: https://youtube.com</p>

        <div class="video-container">
            <iframe id="videoPlayer" src="https://youtube.com" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <!-- 3. External Map Libraries (Loaded Before Core Logic) -->
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>

    <!-- 4. Core Map Logic (Placed Right Before Closing Body Tag) -->
    <script>
        var map = L.map('map').setView([22.5726, 88.3639], 13);
        var userMarker = null;

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        var control = L.Routing.control({
            waypoints: [],
            routeWhileDragging: true
        }).addTo(map);

        function updateMyLocation() {
            document.getElementById('status').style.color = "#007bff";
            document.getElementById('status').innerText = "🔄 Finding your location...";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    var userLat = position.coords.latitude;
                    var userLng = position.coords.longitude;

                    document.getElementById('status').style.color = "green";
                    document.getElementById('status').innerText = "📍 Location Updated!";

                    map.setView([userLat, userLng], 14);

                    if (userMarker) { map.removeLayer(userMarker); }

                    userMarker = L.marker([userLat, userLng]).addTo(map).bindPopup("<b>Your Current Location</b>").openPopup();

                    var currentWaypoints = control.getWaypoints();
                    var endPoint = (currentWaypoints && currentWaypoints[1]) ? currentWaypoints[1].latLng : null;

                    if (endPoint) {
                        control.setWaypoints([L.latLng(userLat, userLng), endPoint]);
                    } else {
                        control.setWaypoints([L.latLng(userLat, userLng)]);
                    }

                }, function(error) {
                    document.getElementById('status').style.color = "red";
                    document.getElementById('status').innerText = "❌ Location denied or unavailable.";
                });
            } else {
                document.getElementById('status').innerText = "Browser doesn't support GPS.";
            }
        }

        // Run tracking on startup
        updateMyLocation();

        map.on('click', function(e) {
            var currentWaypoints = control.getWaypoints();
            var startPoint = (currentWaypoints && currentWaypoints[0]) ? currentWaypoints[0].latLng : map.getCenter();
            
            control.setWaypoints([
                startPoint,
                e.latLng
            ]);
        });

        function changeVideo() {
            var url = document.getElementById('ytUrl').value;
            var videoId = "";

            if (url.includes("v=")) {
                var initialSplit = url.split("v=")[1];
                videoId = initialSplit.split("&")[0];
            } else if (url.includes("youtu.be/")) {
                var initialSplit = url.split("youtu.be/")[1];
                videoId = initialSplit.split("?")[0];
            } else if (url.includes("embed/")) {
                var initialSplit = url.split("embed/")[1];
                videoId = initialSplit.split("?")[0];
            }

            if (videoId) {
                document.getElementById('videoPlayer').src = "https://youtube.com" + videoId;
            }
        }
    </script>
</body>
</html>
